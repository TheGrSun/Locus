[project]
name = "locus"
version = "0.3.0"
description = "Locus: the points a formula picks out, drawn in the chat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.12.2,<3",
    "matplotlib>=3.10.6",
    "sympy>=1.14.0",
    "numpy>=2.2,<3",
    "pydantic>=2.11,<3",
]

[project.scripts]
locus = "locus.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locus"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
